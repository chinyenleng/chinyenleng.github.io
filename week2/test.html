<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        background-color: rgb(226, 226, 226);
    }

    h1 {
        color: rgb(236, 20, 189);
        font-family: Arial, sans-serif;
        text-align: center;
        text-decoration: underline;
        font-size: 50px
    }

    h1.nounderline {
        text-decoration: none;
        text-align: right;
        font-size: 30px
    }

    p {
        color: rgb(185, 113, 252);
        background-color: rgb(255, 255, 0);
        border: 2px dashed black;
        border-radius: 10px;
        padding: 15px;
        margin: 30px;
        font-family: serif;
        text-align: center;
    }

    img {
        margin: auto;
        /*Center the image horizontally*/
        display: block;
        /* make the image to non sharing spacing */
        margin-bottom: 20px;
        /*Add some space below the image*/
    }
</style>

<body>
    <h1>Taylor Swift</h1>
    <h1 class="nounderline">Biography</h1>
    <img src="image/taylor-swift.jpg" width="250" alt="Taylor Swift">
    <p>Taylor Swift is an American singer-songwriter.</p>
</body>

</html>
