<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    button {
        background-color: #000000;
        border: none;
        color: white;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        font-size: 16px;
        margin: 5px;
    }

    button.signup {
        background-color: #56a459;
        border: none;
        color: white;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        font-weight: bold;
        margin: 5px;
        border-radius: 6px;
    }

    button.addtocart {
        background-color: #f9da4e;
        border: none;
        color: black;
        padding: 10px 60px;
        text-align: center;
        text-decoration: none;
        font-size: 15px;
        margin: 5px;
        border-radius: 20px;
    }

    button.getstarted {
        background-color: #7354ad;
        border: none;
        color: white;
        padding: 15px 25px;
        font-weight: bold;
        margin: 5px;
        border-radius: 4px;
    }

    button.download {
        background-color: #ffffff;
        border: 1px solid #b3b5b7;
        color: #72767b;
        padding: 12px 24px;
        font-weight: bold;
        margin: 8px;
        border-radius: 4px;

    }

    button.applyoncompanywebsite {
        background-color: #2d65bc;
        border: none;
        color: white;
        padding: 12px 30px;
        font-weight: bold;
        margin: 8px;
        border-radius: 25px;
    }

    button.save {
        background-color: #ffffff;
        border: 1px solid #5d7bb7;
        color: #3664bb;
        padding: 12px 28px;
        font-weight: bold;
        margin: 8px;
        border-radius: 25px;
    }
</style>

<body>
    <button>Request now</button>
    <button class="signup">Sign up</button>
    <button class="addtocart">Add to Cart</button><br>
    <button class="getstarted">Get Started</button>
    <button class="download">Download</button>
    <button class="applyoncompanywebsite">Apply on company website</button>
    <button class="save">Save</button>
</body>

</html>
