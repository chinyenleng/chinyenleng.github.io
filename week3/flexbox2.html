<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        margin: 0;
    }

    .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 30px 60px;
    }

    .logo {
        display: flex;
        align-items: center;
    }

    .logo img {
        margin-right: 10px;
    }

    .menu {
        display: flex;
        gap: 60px;
        align-items: flex-end;

    }

    .button button {
        padding: 10px 20px;
        background: white;
        border: 2px solid black;
        border-radius: 8px;
    }
</style>

<body>
    <div class="bar">
        <div class="logo">
            <img src="image/icon.png" width="20px" height="20px">
            <h1>Positius</h1>
        </div>
        <div class="menu">
            <p>About Us</p>
            <p>Services</p>
            <p>Use Cases</p>
            <p>Pricing</p>
            <p>Blog</p>
        </div>
        <div class="button">
            <button>Request a quote</button>
        </div>
    </div>
</body>

</html>
