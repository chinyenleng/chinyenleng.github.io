<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Gelasio:ital,wght@0,400..700;1,400..700&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap');

    body {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
    }

    .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 80px;
    }

    .logo {
        display: flex;
        align-items: center;
        ;
    }

    .logo img {
        margin-right: 10px;
    }

    .menu {
        display: flex;
        gap: 40px;
        align-items: center;
        font-size: 20px
    }

    .buttonrequestaquote {
        padding: 15px 30px;
        background: white;
        border: 1px solid black;
        border-radius: 8px;
        font-size: 20px;
    }

    .text {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 60px 100px;
    }

    .buttonbookaconsutation {
        background-color: black;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 20px;
        padding: 15px 35px
    }

    .left {
        width: 40%
    }

    .left h1 {
        font-size: 60px;
        font-weight: 500;
        line-height: 1.2;
    }

    .left p {
        font-size: 20px;
        line-height: 1.4;
        width: 90%;
    }

    .right {
        width: 45%;
    }
</style>

<body>
    <div class="bar">
        <div class="logo">
            <img src="image/icon.png" width="20px" height="20px">
            <h1>Positius</h1>
        </div>
        <div class="menu">
            <p>About Us</p>
            <p>Services</p>
            <p>Use Cases</p>
            <p>Pricing</p>
            <p>Blog</p>
        </div>
        <div class="button">
            <button class="buttonrequestaquote">Request a quote</button>
        </div>
    </div>
    <div class="text">
        <div class="left">
            <h1>Navigating the digital landscape for success</h1>
            <p>Our digital marketing agency helps businesses grow and succeed online through a range of services
                including SEO, PPC, social media marketing, and content creation.</p>
            <button class="buttonbookaconsutation">Book a consutation</button>
        </div>
        <div class="right">
            <img src="image/illustration.png" width="500px">
        </div>
    </div>
    <div class="'company">

    </div>

</body>

</html>
